<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Product Scanner Live</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#111;color:#fff}
header{padding:8px 14px;background:#14532d;display:flex;justify-content:space-between;font-weight:700}
#vw{position:relative;background:#000;border:5px solid #dc2626}#vw.ok{border-color:#16a34a}#vw.wait{border-color:#f59e0b}
video{width:100%;max-height:42vh;object-fit:cover;display:block}
#msg{position:absolute;left:0;right:0;top:0;padding:8px;text-align:center;font-weight:800;font-size:18px;background:#dc2626}
#msg.ok{background:#16a34a}#msg.wait{background:#d97706}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.c{border-radius:8px;padding:8px 6px;font-size:13px;background:#7f1d1d;min-height:54px}
.c b{display:block;font-size:11px;opacity:.85}.c span{font-size:15px;font-weight:700;word-break:break-word}
.c.am{background:#92400e}.c.gr{background:#166534}
.row{display:flex;gap:8px;padding:6px 8px}
button{flex:1;padding:15px 8px;font-size:17px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700}
button.b{background:#2563eb}button.g{background:#4b5563}button.r{background:#b91c1c}button:disabled{opacity:.4}
#sug{padding:0 8px;display:flex;gap:6px;flex-wrap:wrap}#sug button{flex:none;padding:8px 10px;font-size:13px;background:#374151;text-align:left}
form,#list{padding:6px 10px}label{font-size:12px;color:#9ca3af;display:block;margin-top:6px}
input,textarea{width:100%;padding:11px;font-size:16px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff}
img.ph{height:90px;border-radius:6px;margin:6px 6px 0 0;background:#000}
.it{background:#1f2937;border-radius:8px;padding:8px;margin:6px 0;display:flex;gap:8px;align-items:center;font-size:14px}.it img{width:52px;height:52px;object-fit:cover;border-radius:6px}
#toast{position:fixed;left:10px;right:10px;bottom:16px;background:#22c55e;color:#000;padding:12px;border-radius:10px;text-align:center;font-weight:700;display:none}
</style></head><body>
<header><span>Live Scanner</span><span id="cnt">0 saved</span></header>
<div id="vw"><video id="v" playsinline muted autoplay></video><div id="msg">Camera chalu ho raha hai...</div></div>
<div id="chips"></div><div id="sug"></div><div id="alts" style="padding:0 8px"></div>
<div style="padding:4px 8px"><input id="q" placeholder="🔍 Product dhundo: naam/company ke 3-4 akshar" autocomplete="off"></div><div id="qr" style="padding:0 8px"></div>
<div style="padding:4px 8px"><label style="margin:0 0 4px;font-size:15px;color:#facc15">Stock me kitna hai? (qty, jitna dabba/piece abhi hai)</label><input id="qty" inputmode="numeric" placeholder="jaise 12" style="font-size:26px;text-align:center;font-weight:700"></div>
<div class="row"><button class="b" id="bstill" onclick="stillScan()">📸 Peeche ki SAAF photo (batch / expiry / MRP)</button></div>
<div class="row"><button id="sv" onclick="save()" disabled>SAVE</button><button class="g" onclick="resetAll()">Naya product</button></div>
<form onsubmit="return false"><div id="ph"></div>
<label>Naam (Localwell)</label><input id="name"><label>Company</label><input id="company">
<label>MRP</label><input id="mrp" inputmode="decimal"><label>Batch</label><input id="batch"><label>Expiry</label><input id="exp"><label>Mfg</label><input id="mfg">
<label>Barcode</label><input id="bar" inputmode="numeric"><label>Note</label><input id="note"></form>
<div class="row"><button class="b" onclick="exp_()">Export (CSV + JSON)</button><button class="g" onclick="showList()">Saved list</button></div>
<div class="row"><button class="r" onclick="clearLocal()">Is phone ka test data hatao</button></div>
<div id="list"></div><div id="toast"></div>

 let x=T.match(/(?:₹|RS\.?|INR)\s?(\d{1,2},?\d{0,3}(?:\.\d{1,2})?)/i);if(x)return x[1].replace(/,(?=\d{3}(?!\d))/g,'');

function extract(t){const T=t.replace(/[|]/g,'I'),o={},m=(re)=>{const r=T.match(re);return r?r[1].trim():null};
 let mrp=mrpFrom(T);
 if(mrp){const n=parseFloat(mrp);if(n>=10&&n<=20000&&!(n>=1990&&n<=2100&&/^\d{4}$/.test(mrp)))o.mrp=String(n)}
 let b=m(/(?:B\.?\s?NO\.?|BATCH\s?(?:NO\.?)?|B\/N|LOT\s?(?:NO\.?)?)\s*[:.\-]?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i);if(b&&/\d/.test(b)&&b.length<=15)o.batch=b.toUpperCase();
 if(!o.batch){const bx=T.match(/\b([A-Z]{1,3})\s?[:\-]\s?(\d{3,6})\b/g);if(bx)for(const s of bx){const mm=s.match(/([A-Z]{1,3})\s?[:\-]\s?(\d{3,6})/);if(!/^(MFG|MFD|EXP|MRP|NO|DT|ED|RS|DOM|PH|TEL|FAX|PIN|LIC|FSSAI|GST|BN)$/.test(mm[1])){o.batch=mm[1]+mm[2];break}}}
 let e=m(new RegExp('(?:EXP(?:IRY)?\\.?(?:\\s?(?:DATE|DT)\\.?)?|E\\.?D\\.?|USE\\s?BY|EXPIRES?)\\s*[:.\\-]?[^\\n0-9]{0,30}?\\s*'+D,'i'));if(e)o.exp=e.toUpperCase().replace(/\s+/g,' ').trim();
 let f=m(new RegExp('(?:MFG\\.?|MFD\\.?|M\\.?F\\.?G\\.?|MANUF[A-Z.]*|DATE\\s?OF\\s?(?:MFG|MANUFACTURE|MANUFACTURING)|D\\.?O\\.?M\\.?)\\s*(?:DATE|DT|ON)?\\.?\\s*[:.\\-]?[^\\n0-9]{0,30}?\\s*'+D,'i'));if(f)o.mfg=f.toUpperCase().replace(/\s+/g,' ').trim();
 let sl=m(/(?:BEST\s*BEFORE|USE\s*(?:WITHIN|BEFORE)|SHELF\s*LIFE|VALID\s*FOR|EXPIRY|EXP\.?)[^0-9\n]{0,30}(\d{1,3})\s*(?:MONTHS?|MTHS?|MOS?)\b/i);if(sl&&+sl>=3&&+sl<=60)o.shelf=sl;

 return o}
function addCand(k,v){if(!v)return;const c=S.cand[k]=S.cand[k]||{};c[v]=(c[v]||0)+1}
function topv(k){const c=S.cand[k];if(!c)return null;let b=null,n=0;for(const v in c)if(c[v]>n){b=v;n=c[v]}return{v:b,n}}
function findCompany(txt){const N=' '+txt.toUpperCase().replace(/[^A-Z0-9]+/g,' ')+' ';for(const c of COMP){const k=' '+c.toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()+' ';if(N.includes(k))return c}return null}
function matchProd(){ // Localwell name suggestion from words seen so far
 const bag=S.bag;if(bag.size<2)return[];const mrp=topv('mrp');const out=[];
 for(const p of PRODS){const toks=p[0].toUpperCase().split(/[^A-Z0-9]+/).filter(t=>t.length>=2);if(!toks.length)continue;let hit=0,tot=0,hd=0,hn=0;
  for(const t of toks){if(/^\d+$/.test(t))continue;const w=/\d/.test(t)?2:1.2;tot+=w;if(bag.has(t)){hit+=w;if(/\d/.test(t))hn++;else if(t.length>=4)hd++}else if(t.length>=5){for(const x of bag){if(x.length>=5&&Math.abs(x.length-t.length)<=1&&lev(x,t)<=1){hit+=w*.8;break}}}}
  let sc=hit/tot;if(S.cand.company){const c=topv('company').v;if(p[1].toUpperCase()===c.toUpperCase())sc+=.12}
  if(mrp&&p[2].includes(Math.round(parseFloat(mrp.v))))sc+=.12;const cmOK=S.cand.company&&p[1].toUpperCase()===topv('company').v.toUpperCase();if(sc>=.6&&(hd>=2||(hd>=1&&hn>=1&&cmOK)))out.push([p,Math.min(sc,1)])}
 out.sort((a,b)=>b[1]-a[1]);return out.slice(0,3)}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

 const v=$('v');if(!v.videoWidth||S.done){return}
 if(S.complete){render();await new Promise(r=>setTimeout(r,400));return}
 if(window.stillBusy){await new Promise(r=>setTimeout(r,300));return}

 if(mo>14||sh<18){msg('✋ Hold still karo (hil raha hai / dhundhla hai)','');await new Promise(r=>setTimeout(r,250));return}
 if(!worker){msg('Padhne ka engine load ho raha hai...','wait');try{worker=await Tesseract.createWorker('eng')}catch(e){msg('Engine load nahi hua, net check karo','');return}}
 msg('Padh raha hoon... product ko aise hi rakho','wait');
 if('BarcodeDetector' in window){try{const r=await new BarcodeDetector().detect(c);r.forEach(x=>addCand('bar',x.rawValue))}catch(e){}}
 const vr=(tickN++)%2;const r=await worker.recognize(prep(c,vr));const t=r.data.text||'';const cf=(r.data.confidence===undefined?100:r.data.confidence);if(cf<(vr?30:50)){msg('Text saaf nahi dikh raha, label ke paas lao / roshni badhao','');return}S.txt+='\n'+t;
 t.toUpperCase().split(/[^A-Z0-9]+/).forEach(w=>{if(w.length>=2)S.bag.add(w)});

 const co=findCompany(t)||findCompany(S.txt);if(co)addCand('company',co);
 const sg=matchProd();S.sug=sg;
 // best photos: front = frame with strongest name/company match, back = frame where MRP/batch found
 const frontScore=(sg[0]&&sg[0][1]>=.75)?sg[0][1]:0;
 if(frontScore>0&&sh*(1+frontScore)>S.best.front.s){S.best.front={s:sh*(1+frontScore),p:small(c)}}
 if(((ex.mrp&&ex.batch)||(ex.mrp&&ex.exp)||(ex.batch&&ex.exp))&&sh>S.best.back.s){S.best.back={s:sh,p:small(c)}}
