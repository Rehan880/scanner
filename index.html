<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Product Scanner Live</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#111;color:#fff}
header{padding:8px 14px;background:#14532d;display:flex;justify-content:space-between;font-weight:700}
#vw{position:relative;background:#000;border:5px solid #dc2626}#vw.ok{border-color:#16a34a}#vw.wait{border-color:#f59e0b}
video{width:100%;max-height:42vh;object-fit:cover;display:block}
#msg{position:absolute;left:0;right:0;top:0;padding:8px;text-align:center;font-weight:800;font-size:18px;background:#dc2626}
#msg.ok{background:#16a34a}#msg.wait{background:#d97706}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.c{border-radius:8px;padding:8px 6px;font-size:13px;background:#7f1d1d;min-height:54px}
.c b{display:block;font-size:11px;opacity:.85}.c span{font-size:15px;font-weight:700;word-break:break-word}
.c.am{background:#92400e}.c.gr{background:#166534}
.row{display:flex;gap:8px;padding:6px 8px}
button{flex:1;padding:15px 8px;font-size:17px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700}
button.b{background:#2563eb}button.g{background:#4b5563}button.r{background:#b91c1c}button:disabled{opacity:.4}
#sug{padding:0 8px;display:flex;gap:6px;flex-wrap:wrap}#sug button{flex:none;padding:8px 10px;font-size:13px;background:#374151;text-align:left}
form,#list{padding:6px 10px}label{font-size:12px;color:#9ca3af;display:block;margin-top:6px}
input,textarea{width:100%;padding:11px;font-size:16px;border-radius:8px;border:1px solid #374151;background:#1f2937;color:#fff}
img.ph{height:90px;border-radius:6px;margin:6px 6px 0 0;background:#000}
.it{background:#1f2937;border-radius:8px;padding:8px;margin:6px 0;display:flex;gap:8px;align-items:center;font-size:14px}.it img{width:52px;height:52px;object-fit:cover;border-radius:6px}
#toast{position:fixed;left:10px;right:10px;bottom:16px;background:#22c55e;color:#000;padding:12px;border-radius:10px;text-align:center;font-weight:700;display:none}
</style></head><body>
<header><span>Live Scanner</span><span id="cnt">0 saved</span></header>
<div id="vw"><video id="v" playsinline muted autoplay></video><div id="msg">Camera chalu ho raha hai...</div></div>
<div id="chips"></div><div id="sug"></div><div id="alts" style="padding:0 8px"></div>
<div style="padding:4px 8px"><input id="q" placeholder="🔍 Product dhundo: naam/company ke 3-4 akshar" autocomplete="off"></div><div id="qr" style="padding:0 8px"></div>
<div style="padding:4px 8px"><label style="margin:0 0 4px;font-size:15px;color:#facc15">Stock me kitna hai? (qty, jitna dabba/piece abhi hai)</label><input id="qty" inputmode="numeric" placeholder="jaise 12" style="font-size:26px;text-align:center;font-weight:700"></div>
<div class="row"><button id="sv" onclick="save()" disabled>SAVE</button><button class="g" onclick="resetAll()">Naya product</button></div>
<form onsubmit="return false"><div id="ph"></div>
<label>Naam (Localwell)</label><input id="name"><label>Company</label><input id="company">
<label>MRP</label><input id="mrp" inputmode="decimal"><label>Batch</label><input id="batch"><label>Expiry</label><input id="exp"><label>Mfg</label><input id="mfg">
<label>Barcode</label><input id="bar" inputmode="numeric"><label>Note</label><input id="note"></form>
<div class="row"><button class="b" onclick="exp_()">Export (CSV + JSON)</button><button class="g" onclick="showList()">Saved list</button></div>
<div class="row"><button class="r" onclick="clearLocal()">Is phone ka test data hatao</button></div>
<div id="list"></div><div id="toast"></div>

st.qty={v:$('qty').value.trim(),ok:$('qty').value.trim()!==''};
 for(const k of ['mrp','batch','exp','bar']){const t=topv(k);st[k]={v:$(k).value,ok:t?t.n>=2:!!$(k).dataset.manual}}
 if(calc){const mt=topv('mfg');st.exp={v:$('exp').value+' (mfg+'+topv('shelf').v+'m)',ok:mt.n>=2}}
 $('chips').innerHTML=F.map(([k,l])=>{const s=st[k];const cls=s.v?(s.ok?'gr':'am'):'';return `<div class="c ${cls}"><b>${l}${k==='bar'?' (optional)':''}</b><span>${s.v||'— khali —'}</span></div>`}).join('');
 let cs=[];const cn=$('company').value,mv=parseFloat($('mrp').value);if(!S.sug.length&&cn&&!$('name').dataset.manual){const L=PRODS.map((p,i)=>[p,i]).filter(([p])=>p[1].toUpperCase()===cn.toUpperCase());let M=L.filter(([p])=>mv&&p[2].includes(Math.round(mv)));cs=(M.length?M:L).slice(0,8)}
 $('sug').innerHTML=(cs.length?'<div style="width:100%;font-size:12px;color:#9ca3af">'+cn+' ke products'+(mv?' (MRP '+mv+')':'')+': naam chuno</div>':'')+cs.map(([p,i])=>`<button onclick="pickP(${i})">${p[0]}</button>`).join('')+S.sug.map((x,i)=>`<button onclick="pick(${i})">${x[0][0]} · ${x[0][1]} (${Math.round(x[1]*100)}%)</button>`).join('');
 let al='';for(const [k,l] of [['batch','Batch'],['exp','Expiry'],['mrp','MRP']]){const c=S.cand[k];if(c){const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4);if(e.length>1)al+='<div style="font-size:12px;color:#9ca3af;margin-top:4px">'+l+' aur padha gaya:</div>'+e.map(([v,n])=>`<button style="flex:none;padding:6px 10px;font-size:13px;background:#374151;margin:2px" onclick="setv('${k}','${v.replace(/'/g,'')}')">${v} (${n})</button>`).join('')}}
 $('alts').innerHTML=al;
 const miss=REQ.filter(k=>!st[k].v),shaky=REQ.filter(k=>st[k].v&&!st[k].ok);
 S.complete=!miss.length&&!shaky.length;if(!S.complete&&['company','mrp','batch','exp'].every(k=>st[k].v&&st[k].ok))S.complete=true;
 if(!miss.length&&!shaky.length){msg('✅ Complete! SAVE dabao','ok');beep()}
 else if(!miss.length){msg('Lagbhag ho gaya, '+shaky.map(k=>st[k].v&&F.find(f=>f[0]===k)[1]).join(', ')+' ek aur baar dikhao','wait')}
 else{const back=['mrp','batch','exp'].filter(k=>miss.includes(k)),front=miss.filter(k=>k==='company'||k==='name');
  if(miss.length===1&&miss[0]==='name')msg('Naam khud nahi mila: neeche naam chuno ya 🔍 box se dhundo','wait');else if(!front.length&&!back.length)msg('Neeche "Stock me kitna hai" me qty bharo','wait');else msg(front.length?'Saamne ka hissa dikhao ('+front.map(k=>F.find(f=>f[0]===k)[1]).join(', ')+' chahiye)':'Dabba ghumao: peeche/neeche ('+back.map(k=>F.find(f=>f[0]===k)[1]).join(', ')+' chahiye)','')}
 $('ph').innerHTML=(S.best.front.p?'<img class="ph" src="'+S.best.front.p+'">':'')+(S.best.back.p?'<img class="ph" src="'+S.best.back.p+'">':'');
 const dp=dupOf();if(dp){msg('⚠ Ye product PEHLE SCAN ho chuka hai: '+dp.name+(dp.batch?' (batch '+dp.batch+')':'')+' — '+(dp.scanner||'koi')+', '+String(dp.created_at||'').slice(0,10)+'. Doosra dabba lo','')}
 $('sv').disabled=!$('name').value.trim()||$('qty').value.trim()===''}
let beeped=false;function beep(){if(beeped)return;beeped=true;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>{});
$('q').addEventListener('input',()=>{const w=$('q').value.toUpperCase().split(/\s+/).filter(x=>x);if(!w.length){$('qr').innerHTML='';return}const L=PRODS.map((p,i)=>[p,i]).filter(([p])=>{const s=(p[0]+' '+p[1]).toUpperCase();return w.every(x=>s.includes(x))}).slice(0,8);$('qr').innerHTML=L.map(([p,i])=>`<button style="display:block;width:100%;margin:3px 0;padding:10px;font-size:14px;background:#374151;text-align:left" onclick="pickP(${i})">${p[0]} <span style="opacity:.7">· ${p[1]}${p[2].length?' · MRP '+p[2].join('/'):''}</span></button>`).join('')||'<div style="font-size:13px;color:#9ca3af">Kuch nahi mila</div>'});
function pickP(i){const p=PRODS[i];$('name').value=p[0];$('name').dataset.manual='1';$('company').value=p[1];$('company').dataset.manual='1';if(p[2].length===1&&!$('mrp').value){$('mrp').value=p[2][0]}$('q').value='';$('qr').innerHTML='';render()}
function setv(k,v){$(k==='exp'?'exp':k).value=v;$(k==='exp'?'exp':k).dataset.manual='1';render()}
function pick(i){const p=S.sug[i][0];$('name').value=p[0];$('name').dataset.manual='1';$('company').value=p[1];$('company').dataset.manual='1';render()}
document.addEventListener('input',e=>{if(e.target.tagName==='INPUT')e.target.dataset.manual='1'});
function resetAll(){fresh();prev=null;beeped=false;['name','company','mrp','batch','exp','mfg','bar','note','qty'].forEach(i=>{$(i).value='';delete $(i).dataset.manual});$('ph').innerHTML='';$('chips').innerHTML='';$('sug').innerHTML='';msg('Naya product dikhao','');render()}
async function save(){if(!$('name').value.trim())return;if($('qty').value.trim()===''||isNaN(parseFloat($('qty').value))){toast('Pehle stock qty bharo (0 bhi chalega)');return}const dp=dupOf();if(dp&&!confirm('Ye product pehle scan ho chuka hai: '+dp.name+(dp.batch?' (batch '+dp.batch+')':'')+' — '+(dp.scanner||'koi')+'.\nDobara bhi save karein? (Doosra batch ho to haan)'))return;
 const rec={time:new Date().toISOString(),name:$('name').value.trim(),company:$('company').value.trim(),mrp:$('mrp').value.trim(),batch:$('batch').value.trim(),expiry:$('exp').value.trim(),mfg:$('mfg').value.trim(),barcode:$('bar').value.trim(),qty:parseFloat($('qty').value),note:$('note').value.trim(),raw:S.txt,photo_front:S.best.front.p,photo_back:S.best.back.p,scanner:who(),synced:false};
 await new Promise(r=>{const q=tx('readwrite').add(rec);q.onsuccess=r});toast('Save ho gaya ✔  Agla product dikhao');resetAll();await count();sync()}
async function sync(){try{const a=(await all()).filter(x=>!x.synced);for(const x of a){const {id,synced,time,...body}=x;const res=await fetch(SB,{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)});if(!res.ok)throw new Error(await res.text());await new Promise(r=>{const q=tx('readwrite').put({...x,synced:true});q.onsuccess=r})}online=true}catch(e){online=false;console.log(e)}await pull();count()}
async function pull(){try{const res=await fetch(SB+'?select=name,company,mrp,batch,expiry,barcode,scanner,created_at&order=created_at.desc&limit=5000',{headers:H});if(!res.ok)throw new Error(await res.text());SRV=await res.json();online=true}catch(e){online=false}}
setInterval(sync,20000);setTimeout(sync,1500);
async function showList(){const a=await all();$('list').innerHTML=a.slice().reverse().map(r=>`<div class="it">${r.photo_front?'<img src="'+r.photo_front+'">':''}<div style="flex:1"><b>${r.name}</b><br>Qty <b>${r.qty??'-'}</b> · MRP ${r.mrp||'-'} · Batch ${r.batch||'-'} · Exp ${r.expiry||'-'}</div><button class="r" style="flex:none;padding:8px 10px;font-size:13px" onclick="del(${r.id})">X</button></div>`).join('')||'Abhi kuch save nahi'}
async function clearLocal(){if(!confirm('Is phone me save hue SAARE scans hata dein? (Supabase ka data nahi hatega)'))return;await new Promise(r=>{const q=tx('readwrite').clear();q.onsuccess=r});await count();showList();toast('Is phone ka local data hat gaya')}
async function del(id){if(!confirm('Hata dein?'))return;await new Promise(r=>{const q=tx('readwrite').delete(id);q.onsuccess=r});count();showList()}
function dl(n,t,d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
async function exp_(){const a=await all();if(!a.length){toast('Kuch save nahi hai');return}const d=new Date().toISOString().slice(0,10),q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 dl('scans_'+d+'.csv','text/csv','﻿Name,Company,MRP,Batch,Expiry,Mfg,Barcode,Qty,Note,Time\n'+a.map(r=>[r.name,r.company,r.mrp,r.batch,r.expiry,r.mfg,r.barcode,r.qty,r.note,r.time].map(q).join(',')).join('\n'));setTimeout(()=>dl('scans_'+d+'.json','application/json',JSON.stringify(a)),600)}
</script></body></html>
