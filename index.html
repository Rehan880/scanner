<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Stock Counter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f4f6;color:#111}
header{position:sticky;top:0;background:#14532d;color:#fff;padding:8px 10px;z-index:5}
.row{display:flex;gap:6px;align-items:center}input,select{font-size:16px;padding:9px;border-radius:8px;border:0;width:100%}
.prog{font-size:13px;margin:6px 0 2px}.bar{height:8px;background:#ffffff40;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#86efac;width:0}
.tabs{display:flex;gap:6px;margin-top:6px}.tabs button{flex:1;padding:8px;border:0;border-radius:8px;background:#ffffff30;color:#fff;font-size:14px}.tabs .on{background:#fff;color:#14532d;font-weight:700}
.it{display:flex;gap:10px;align-items:center;background:#fff;margin:6px 8px;padding:8px;border-radius:10px;box-shadow:0 1px 2px #0002}
.it img,.ph{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#e5e7eb;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.it .n{font-weight:600;font-size:14px;line-height:1.25}.it .s{font-size:12px;color:#6b7280}
.q{margin-left:auto;text-align:right;font-size:20px;font-weight:800;color:#15803d}.q small{display:block;font-size:11px;color:#6b7280;font-weight:400}
.d{color:#b91c1c}.ok{border-left:5px solid #16a34a}
#pn{position:fixed;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;overflow:auto}
#pn .top{background:#14532d;color:#fff;padding:12px;font-weight:700;font-size:16px}
#pn .bd{padding:12px;flex:1}.cam{width:100%;aspect-ratio:4/3;background:#e5e7eb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#374151;overflow:hidden;position:relative}
.cam img{width:100%;height:100%;object-fit:contain;background:#fff}
.big{font-size:38px;text-align:center;font-weight:800;padding:10px}
.st{display:flex;gap:8px;margin:10px 0}.st button{flex:1;font-size:28px;padding:10px;border:0;border-radius:10px;background:#e5e7eb}
.go{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;bottom:0;box-shadow:0 -2px 6px #0002}
.go button{flex:1;padding:16px;font-size:18px;border:0;border-radius:12px;font-weight:700}.sv{background:#15803d;color:#fff}.cl{background:#e5e7eb}
.sm{font-size:13px;color:#4b5563}.bt{border:0;border-radius:8px;padding:8px 10px;background:#ffffff30;color:#fff;font-size:13px}
#sy{font-size:12px;opacity:.9}
</style></head><body>
<header>
<div class="row"><input id="q" placeholder="Item ka naam search karo..." autocomplete="off"><select id="co" style="width:44%"><option value="">Sab company</option></select></div>
<div class="prog"><span id="pg"></span> <span id="sy"></span></div><div class="bar"><i id="pb"></i></div>
<div class="tabs"><button data-t="todo" class="on">Baaki</button><button data-t="done">Ho gaye</button><button data-t="diff">Farak</button></div>
<div class="row" style="margin-top:6px"><button class="bt" id="ad">+ Naya item</button><button class="bt" id="ex">CSV nikalo</button><button class="bt" id="sn">Sync</button><button class="bt" id="nm">Naam</button></div>
</header>
<div id="ls"></div>
<div id="pn"><div class="top" id="pt"></div>
<div class="bd"><div class="sm" id="pi"></div>
<label class="cam" id="cm"><span id="ct">📷 Photo kheencho (saamne se)</span><input type="file" accept="image/*" capture="environment" id="fi" hidden></label>
<div class="sm" style="margin-top:6px">Tip: product seedha saamne, safed ya saaf jagah par, label dikhe.</div>
<div class="big"><input id="qty" type="number" inputmode="numeric" min="0" placeholder="Qty" style="font-size:38px;text-align:center;font-weight:800;border:2px solid #16a34a"></div>
<div class="st"><button id="m">−</button><button id="z" style="font-size:16px">0 (stock nahi)</button><button id="p">+</button></div>
</div><div class="go"><button class="cl" id="cx">Wapas</button><button class="sv" id="sv">SAVE ➜ agla</button></div></div>

let EXTRA=[];
const list=()=>ITEMS.map(x=>({k:x[0],n:x[1],co:x[2],sz:x[3],sys:x[4]})).concat(EXTRA);
function compress(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>res(null);im.src=u})}
function render(){
 const q=$('q').value.trim().toUpperCase().split(/\s+/).filter(Boolean),co=$('co').value;
 let L=list();const done=L.filter(x=>C[x.k]&&C[x.k].qty!=null).length;
 $('pg').textContent=done+' / '+L.length+' ho gaye';$('pb').style.width=(done/L.length*100)+'%';
 L=L.filter(x=>(!co||x.co===co)&&q.every(w=>(x.n+' '+x.co).toUpperCase().includes(w)));
 const d=x=>C[x.k]&&C[x.k].qty!=null;
 if(tab==='todo')L=L.filter(x=>!d(x));else if(tab==='done')L=L.filter(d);else L=L.filter(x=>d(x)&&C[x.k].qty!==Math.round(x.sys));
 $('ls').innerHTML=L.slice(0,150).map(x=>{const c=C[x.k],dn=d(x);
  return `<div class="it ${dn?'ok':''}" onclick="openP('${x.k}')">${c&&c.photo?`<img src="${c.photo}">`:'<div class="ph">📦</div>'}<div><div class="n">${x.n}</div><div class="s">${x.co} · system: ${Math.round(x.sys)}</div></div><div class="q ${dn&&c.qty!==Math.round(x.sys)?'d':''}">${dn?c.qty:'—'}<small>${dn?'gina':'baaki'}</small></div></div>`}).join('')+(L.length>150?`<div class="sm" style="padding:12px">Aur ${L.length-150} hain — search ya company chuno</div>`:'')||'<div class="sm" style="padding:20px">Kuch nahi</div>'}
function openP(k){const x=list().find(a=>a.k===k);cur=x;const c=C[k]||{};photo=c.photo||null;
 $('pn').style.display='flex';$('pt').textContent=x.n;$('pi').textContent=x.co+' · Localwell stock: '+Math.round(x.sys);
 $('qty').value=c.qty!=null?c.qty:'';setCam();$('fi').value='';}
function setCam(){$('cm').innerHTML=(photo?`<img src="${photo}">`:'<span>📷 Photo kheencho (saamne se)</span>')+'<input type="file" accept="image/*" capture="environment" id="fi" hidden>';$('fi').onchange=async e=>{const f=e.target.files[0];if(f){photo=await compress(f);setCam()}}}
$('m').onclick=()=>{$('qty').value=Math.max(0,(+$('qty').value||0)-1)};$('p').onclick=()=>{$('qty').value=(+$('qty').value||0)+1};$('z').onclick=()=>{$('qty').value=0};
$('cx').onclick=()=>$('pn').style.display='none';
async function save(){const v=$('qty').value;if(v===''){alert('Qty likho (stock nahi hai to 0)');return}
 const o=Object.assign({},C[cur.k]||{},{k:cur.k,n:cur.n,co:cur.co,sys:cur.sys,qty:parseInt(v),photo:photo,by:who(),t:Date.now(),dirty:1});
 C[cur.k]=o;await put(o);$('pn').style.display='none';render();sync();
 if(tab==='todo'){const nx=list().find(x=>!(C[x.k]&&C[x.k].qty!=null)&&(!$('co').value||x.co===$('co').value)&&(!$('q').value||(x.n+' '+x.co).toUpperCase().includes($('q').value.toUpperCase())));if(nx&&confirm('Agla: '+nx.n+' ?'))openP(nx.k)}}
$('sv').onclick=save;$('qty').onkeydown=e=>{if(e.key==='Enter')save()};
$('q').oninput=render;$('co').onchange=render;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('ad').onclick=async()=>{const n=prompt('Naya item ka poora naam (COMPANY + PRODUCT + SIZE):');if(!n)return;const co=prompt('Company:','')||'';const k='N'+n.toUpperCase().replace(/[^A-Z0-9]/g,'');if(list().some(x=>x.k===k)){alert('Ye item pehle se hai');return}
 EXTRA.push({k,n:n.toUpperCase(),co,sz:'',sys:0,nw:1});try{localStorage.setItem('sc_extra',JSON.stringify(EXTRA))}catch(e){}fillCo();openP(k)}
$('nm').onclick=()=>{const w=prompt('Tumhara naam?',localStorage.getItem('sc_who')||'');if(w)try{localStorage.setItem('sc_who',w)}catch(e){}};
function csv(){const L=list().map(x=>{const c=C[x.k]||{};return [x.n,x.co,Math.round(x.sys),c.qty!=null?c.qty:'',c.qty!=null?c.qty-Math.round(x.sys):'',c.by||'']});
 const t='Item,Company,Localwell stock,Gina hua,Farak,Kisne\n'+L.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download='stock_count.csv';a.click()}
$('ex').onclick=csv;
async function sync(){const d=Object.values(C).filter(x=>x.dirty);try{
  if(d.length){const r=await fetch(SB+'?on_conflict=k',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(d.map(x=>({k:x.k,name:x.n,company:x.co,sys_qty:x.sys,qty:x.qty,photo:x.photo,counted_by:x.by,updated_at:new Date(x.t).toISOString()})))});
   if(!r.ok)throw new Error(r.status);for(const x of d){x.dirty=0;await put(x)}}
  const g=await fetch(SB+'?select=k,name,company,sys_qty,qty,photo,counted_by,updated_at&limit=2000',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(g.ok){for(const r of await g.json()){const m=C[r.k];const t=Date.parse(r.updated_at);if(!m||(t>m.t&&!m.dirty)){C[r.k]={k:r.k,n:r.name,co:r.company,sys:r.sys_qty||0,qty:r.qty,photo:r.photo,by:r.counted_by,t,dirty:0};await put(C[r.k]);if(!list().some(x=>x.k===r.k))EXTRA.push({k:r.k,n:r.name,co:r.company,sys:r.sys_qty||0,sz:''})}}}
  $('sy').textContent='✔ sync '+new Date().toLocaleTimeString('en-GB').slice(0,5);render()}catch(e){$('sy').textContent=d.length?'⚠ '+d.length+' sync baaki (net/table?)':'offline'}}
$('sn').onclick=sync;
function fillCo(){const cs=[...new Set(list().map(x=>x.co))].sort();const v=$('co').value;$('co').innerHTML='<option value="">Sab company</option>'+cs.map(c=>`<option>${c}</option>`).join('');$('co').value=v}
(async()=>{await idb();try{EXTRA=JSON.parse(localStorage.getItem('sc_extra')||'[]')}catch(e){}(await all()).forEach(o=>C[o.k]=o);fillCo();render();sync();setInterval(sync,30000)})();
</script></body></html>
