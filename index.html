async function login(email,pw){const r=await raw('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});const j=await r.json();if(!r.ok)throw {message:j.error_description||j.msg||'Login nahi hua'};setS(j)}
function setS(j){S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:j.user&&j.user.id||(S&&S.uid),email:(j.user&&j.user.email)||(S&&S.email)};lsset('sc2s',JSON.stringify(S))}
async function refresh(){if(!S)throw {message:'login chahiye'};const r=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.rt})});const j=await r.json();if(!r.ok){S=null;lsset('sc2s','');throw {auth:true,message:'Dobara login karo'}}setS(j)}
async function api(path,o={},retry=true){if(!S)throw {auth:true,message:'login chahiye'};if(Date.now()>S.exp-60000)await refresh();o.headers=Object.assign({Authorization:'Bearer '+S.at},o.headers||{});const r=await raw(path,o);if(r.status===401&&retry){await refresh();return api(path,o,false)}return r}
async function rpc(fn,args){const r=await api('/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw {server:true,message:m||('Error '+r.status)}}try{return await r.json()}catch(e){return null}}
async function getAll(path){let out=[],off=0;for(;;){const r=await api(path+(path.includes('?')?'&':'?')+'limit=1000&offset='+off);if(!r.ok)throw {message:'Data nahi aaya ('+r.status+')'};const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000}return out}

async function enq(op){op.k=op.id2||uuid();op.t=Date.now();op.state='new';QUEUE.push(op);await kvset(op.k,op,'q');render();flush()}
let flushing=false;
async function flush(){if(flushing||!S)return;flushing=true;const tried=new Set();try{let again=true,stop=false;while(again&&!stop){again=false;for(const op of QUEUE.slice()){if(op.state==='failed'||tried.has(op))continue;tried.add(op);try{await runOp(op);QUEUE=QUEUE.filter(x=>x!==op);await kvdel(op.k,'q')}catch(e){if(e.offline||e.auth){stop=true;break}op.state='failed';op.err=e.message;await kvset(op.k,op,'q')}}
 if(!stop&&QUEUE.some(o=>o.state!=='failed'&&!tried.has(o)))again=true}
 if(!stop&&!QUEUE.some(o=>o.state!=='failed')&&ONLINE){try{await pull()}catch(e){}}}finally{flushing=false;render()}}

 if(op.type==='newprod')await rpc('create_product',{p_op:op.id,p_name:op.name,p_company:op.company,p_size:op.size,p_variant:'',p_unit:op.unit,p_whole:true});
 else if(op.type==='count'){const q=await rpc('save_count',{p_product:op.pid,p_mode:op.mode,p_qty:op.qty,p_seen:op.seen==null?null:op.seen,p_op:op.id,p_note:op.note||null,p_resolve:!!op.resolve});if(q==null)throw {server:true,message:'Server ne jawab nahi diya'}}
 else if(op.type==='void')await rpc('void_count',{p_count:op.cid});
 else if(op.type==='photo'){const b=await kvget('full:'+op.id,'ph'),t=await kvget('thumb:'+op.id,'ph');if(!b)throw {server:true,message:'Photo file local me nahi mili'};if(!op.d1){await upload(op.path,b);op.d1=1;await kvset(op.k,op,'q')}if(!op.d2){await upload(op.tpath,t);op.d2=1;await kvset(op.k,op,'q')}await rpc('set_primary_photo',{p_id:op.id,p_product:op.pid,p_path:op.path,p_thumb:op.tpath,p_version:op.ver});await kvdel('full:'+op.id,'ph')}
 else if(op.type==='connect')await rpc('connect_ledger',{p_product:op.pid,p_ledger:op.lid,p_primary:!!op.primary,p_reason:op.reason||null,p_status:op.status||'verified'});
 else if(op.type==='unmerge')await rpc('unmerge_ledger',{p_mapping:op.mid,p_reason:op.reason||null});

function lkFind(){const w=$('lkq').value.trim().toUpperCase().split(/\s+/).filter(Boolean);if(!w.length){$('lkr').innerHTML='';return}let L;
 if(lkMode==='merge')L=allP().filter(a=>a.id!==CUR.id&&!a.local&&match(a,w)).slice(0,8).map(a=>`<div class="card" onclick="doMerge('${a.id}')"><b>${esc(a.name)}</b><div class="sm">${esc(a.company)} · ${a.ledger_count} ledger</div></div>`);
 else{const mapped={};MAPS.forEach(m=>mapped[m.ledger_id]=m.product_id);L=LED.filter(l=>w.every(x=>(l.name+' '+l.company).toUpperCase().includes(x))).slice(0,8).map(l=>{const pm=mapped[l.id],mine=pm===CUR.id;return `<div class="card" ${pm&&!mine?'':`onclick="doConnect('${l.id}')"`}><b>${esc(l.name)}</b> <span class="sm">stock ${Math.round(l.system_qty)}</span><div class="sm">${mine?'✔ pehle se juda':pm?'❌ kisi aur product se juda hai (pehle usse alag karo)':esc(l.company)}</div></div>`})}
 $('lkr').innerHTML=L.join('')||'<div class="sm">Kuch nahi mila</div>'}
async function doConnect(lid){const l=LED.find(x=>x.id===lid),p=CUR;let status='verified';
 if(!sameSet(sizeTok(p.name+' '+(p.size||'')),sizeTok(l.name))){if(!confirm(`⚠ SIZE ALAG lag raha hai\nProduct: ${p.name}\nLedger: ${l.name}\n\nPhir bhi jodun? (verify nahi maana jayega, "review" me dikhega)`))return;status='review'}
 else if(!confirm(`"${l.name}" ko "${p.name}" me jod dun?`))return;
 await enq({type:'connect',id:uuid(),pid:p.id,lid,status,reason:'app se'});closeP();toast('Jod diya (sync hote hi dikhega)')}
async function doMerge(dst){const d=allP().find(x=>x.id===dst);if(!confirm(`"${CUR.name}" ko "${d.name}" me merge karun?\n\nDhyan: ginti jodi nahi jayegi. "${d.name}" ko dobara verify/gino. Dono product ki ginti same stock hai ya alag, tum decide karoge.`))return;await enq({type:'merge',id:uuid(),pid:CUR.id,dst,reason:'app se merge'});closeP();toast('Merge bheja. Ab '+d.name+' ki ginti dobara verify karo')}
async function doUnmerge(mid){if(!confirm('Is ledger ko is product se alag karun?\n(Ginti nahi badlegi, product ko dobara verify karna hoga)'))return;await enq({type:'unmerge',id:uuid(),pid:CUR.id,mid,reason:'app se'});closeP();toast('Alag karne ka request bheja')}
async function mkPrimary(lid){await enq({type:'connect',id:uuid(),pid:CUR.id,lid,primary:true,reason:'primary badla'});closeP()}
/* ---------- naya product ---------- */
function newProd(){const n=prompt('Naye item ka poora naam (Localwell jaisa):');if(!n||n.trim().length<3)return;const w=n.toUpperCase().split(/\s+/).filter(x=>x.length>2);const sim=allP().filter(p=>w.length&&w.filter(x=>match(p,[x])).length>=Math.max(2,w.length-1)).slice(0,5);
 if(sim.length&&!confirm('Milte-julte item pehle se hain:\n'+sim.map(p=>'• '+p.name).join('\n')+'\n\nPhir bhi naya banana hai?'))return;
 const co=prompt('Company:','')||'',sz=prompt('Size (jaise 100ml):','')||'',un=prompt('Ginti ki unit (pack/strip/bottle):','pack')||'pack';const id=uuid();
 enq({type:'newprod',id,name:n.trim(),company:co.trim(),size:sz.trim(),unit:un.trim()}).then(()=>{openP(id)})}
/* ---------- menu / import / export ---------- */
$('mn').onclick=()=>{drawMenu();$('mo').classList.add('on')};$('mc').onclick=()=>$('mo').classList.remove('on');
function drawMenu(){const adm=PROF&&PROF.role==='admin';const fails=QUEUE.filter(o=>o.state==='failed');
 $('mb').innerHTML=`<div class="sm">${esc(S&&S.email||'')} · ${adm?'admin':'counter'}</div>
 <button class="btn g" style="width:100%;margin:6px 0" onclick="manualSync()">🔄 Abhi sync karo</button>
 <button class="btn" style="width:100%;margin:6px 0" onclick="$('mo').classList.remove('on');newProd()">+ Naya item (Localwell me nahi hai)</button>
 ${fails.length?`<div class="card"><b>❗ Ye sync nahi hue:</b>${fails.map(o=>`<div class="sm">${esc(o.type)} — ${esc(o.err)} <button class="btn sm2" onclick="retryOp('${o.k}')">retry</button> <button class="btn sm2 r" onclick="dropOp('${o.k}')">hatao</button></div>`).join('')}</div>`:''}
 ${adm?`<div class="card"><div class="hd">Admin</div><button class="btn" style="width:100%;margin:4px 0;background:#fbbf24" onclick="$('lwf').click()">📥 Localwell CSV daalo (stock / product list)</button><button class="btn" style="width:100%;margin:4px 0;background:#a7f3d0" onclick="$('lwf').click()">🔗 Mapping CSV daalo (ledger jodne wali file)</button>${PR.length<5?'<button class="btn y" style="width:100%;margin:4px 0" onclick="loadCatalog()">Pehli baar: 1,192 items ka catalog load karo</button>':''}</div>`:''}
 <div class="card"><div class="hd">CSV nikalo</div><button class="btn" style="width:100%;margin:4px 0" onclick="exp('master')">Product Master CSV</button><button class="btn" style="width:100%;margin:4px 0" onclick="exp('map')">Ledger Mapping CSV</button><button class="btn" style="width:100%;margin:4px 0" onclick="exp('rec')">Stock Reconciliation CSV</button></div>
 <button class="btn r" style="width:100%;margin-top:10px" onclick="logout()">Logout</button>`}
async function manualSync(){$('mo').classList.remove('on');toast('Sync ho raha hai...');try{QUEUE.forEach(o=>{if(o.state==='failed')o.state='new'});await flush();await pull();fillCo();render();toast('✔ Sync ho gaya')}catch(e){toast('❗ '+(e.message||'sync nahi hua'))}}
async function retryOp(k){const o=QUEUE.find(x=>x.k===k);o.state='new';o.err='';await kvset(k,o,'q');drawMenu();flush()}
async function dropOp(k){if(!confirm('Ye pending kaam hata dun? (server tak nahi gaya)'))return;QUEUE=QUEUE.filter(x=>x.k!==k);await kvdel(k,'q');drawMenu();render()}
function csvLine(r){return r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')}
function dl(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(csvLine).join('\n')],{type:'text/csv'}));a.download=name;a.click()}
function exp(t){const A=allP();const pl=p=>(IDX.byP[p.id]||[]);
 if(t==='master')dl('product_master.csv',[['Master Product ID','Product code','Standard product name','Company','Size','Counting unit','Primary ledger ID','Combined system stock','Physical quantity','Stock difference','Verification status','Original image path','Photo status','Counted by','Counted at','Sync status']].concat(A.map(p=>[p.id,p.code,p.name,p.company,p.size,p.unit,p.primary_ledger_id,Math.round(p.system_qty),counted(p)?p.physical_qty:'',counted(p)?diffOf(p):'',p.map_status,p.photo_path||'',hasPhoto(p)?'Saved':'Missing',p.counted_by||'',p.counted_at||'',p.sync?'Pending':'Synced'])));
 else if(t==='map'){const rows=[['Master Product ID','Localwell ledger ID','Original ledger name','Individual system stock','Primary ledger','Mapping status']];A.forEach(p=>pl(p).forEach(m=>rows.push([p.id,m.ledger_id,m.l?m.l.name:'',m.l?m.l.system_qty:'',m.is_primary?'Yes':'No',m.status])));dl('ledger_mapping.csv',rows)}
 else{const snap=A.map(p=>p.snapshot_at).filter(Boolean).sort().pop()||'';dl('stock_reconciliation.csv',[['Master Product ID','Name','System stock','Physical stock','Difference','Reconciliation status','Snapshot timestamp','Verification timestamp']].concat(A.map(p=>{const d=diffOf(p);let s=!counted(p)?'Uncounted':p.ledger_count===0?'Newly discovered (unmapped)':+p.physical_qty===0&&Math.round(p.system_qty)>0?'Confirmed zero (system me stock tha)':+p.physical_qty===0?'Confirmed zero':d===0?'Correct':d>0?'Excess physical':'Short physical';if(p.map_status!=='verified')s+=' | mapping review';if(counted(p)&&!hasPhoto(p)&&+p.physical_qty>0)s+=' | photo missing';if(p.has_conflict)s+=' | recount';return [p.id,p.name,Math.round(p.system_qty),counted(p)?p.physical_qty:'',d==null?'':d,s,p.snapshot_at||snap,p.counted_at||'']})))}}
/* ---------- Localwell CSV import (admin) ---------- */
function parseCsv(s){const R=[];let r=[],c='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch=='"'){if(s[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}if(c||r.length){r.push(c);R.push(r)}return R}
async function chunked(fn,arr,n){let o=[];for(let i=0;i<arr.length;i+=n)o.push(await fn(arr.slice(i,i+n)));return o}
$('lwf').onchange=async e=>{$('mo').classList.remove('on');const msg=[],taken=new Date().toISOString();try{for(const f of e.target.files){const R=parseCsv((await f.text()).replace(/^﻿/,''));const rn=(R.find(r=>r[0]==='Report Name')||[])[1]||'';if((R[0]||[]).includes('Group')&&(R[0]||[]).includes('Ledger')){const H0=R[0],gi=H0.indexOf('Group'),li=H0.indexOf('Ledger'),cj=H0.indexOf('Company'),G={};R.slice(1).forEach(r=>{if(r[gi]&&r[li]){(G[r[gi].trim()]=G[r[gi].trim()]||[]).push({n:r[li].trim(),c:(r[cj]||'').trim()})}});const gs=Object.values(G).filter(x=>x.length>1);if(!gs.length){msg.push(f.name+': koi group nahi mila');continue}if(!confirm('Mapping CSV: '+gs.length+' groups, '+gs.reduce((t,x)=>t+x.length,0)+' ledger jodne hain.\nPehla ledger har group ka MAIN banega.\nGalat jud jaye to baad me Alag karo se wapas ho jata hai.\nShuru karun?')){msg.push('Mapping rok di');continue}toast('Ledger jod raha hoon...',9000);const rs=await chunked(a=>rpc('import_mapping',{p:a.map(x=>({ledgers:x}))}),gs,40);const T=k=>rs.reduce((t,x)=>t+(x[k]||0),0);msg.push('Mapping: '+gs.length+' groups, '+T('joined')+' ledger jude, '+T('skipped')+' pehle se jude, '+T('missing')+' app me nahi mile (stock CSV pehle daalo)');continue}const hi=R.findIndex(r=>r[0]==='Product');if(hi<0){msg.push(f.name+': samajh nahi aayi');continue}const H=R[hi],rows=R.slice(hi+1).filter(r=>r[0]&&r.length>2);const ci=H.indexOf('Company');
 if(/Current Stock/.test(rn)){const qi=H.indexOf('No of Packs'),m={};rows.forEach(r=>{const k=r[0].trim()+'~'+(r[ci]||'').trim();m[k]=m[k]||{n:r[0].trim(),c:(r[ci]||'').trim(),q:0};m[k].q+=parseFloat(r[qi])||0});const arr=Object.values(m);toast('Stock file daal raha hoon ('+arr.length+')...',9000);const res=await chunked(a=>rpc('import_ledgers',{p:a,p_taken:taken,p_set:true}),arr,150);const z=await rpc('zero_unlisted_stock',{p_taken:taken});msg.push('Stock file: '+arr.length+' ledger, '+res.reduce((s,x)=>s+x.new,0)+' naye ledger/product')}
 else if(/Stock Settings/.test(rn)||(H.includes('Company')&&!H.includes('No of Packs'))){const arr=rows.map(r=>({n:r[0].trim(),c:(r[1]||'').trim(),q:null}));const res=await chunked(a=>rpc('import_ledgers',{p:a,p_taken:taken,p_set:false}),arr,150);msg.push('Product list: '+arr.length+' padhe, '+res.reduce((s,x)=>s+x.new,0)+' naye')}}
 await pull();fillCo();render();alert(msg.join('\n')||'Kuch nahi mila')}catch(er){alert('❗ '+(er.message||er))}e.target.value=''};
async function loadCatalog(){if(!confirm('Pehli baar catalog load karun? (1,192 items, 1,237 ledger. Kuch dobara nahi banega)'))return;$('mo').classList.remove('on');toast('Catalog load ho raha hai... 1-2 minute',20000);try{await chunked(a=>rpc('import_catalog',{p:a}),CAT,60);await pull();fillCo();render();toast('✔ Catalog load ho gaya. Ab Localwell ka naya stock CSV daalo.',8000)}catch(e){alert('❗ '+e.message)}}
/* ---------- login / boot ---------- */
function showLogin(){$('lg').classList.add('on')}
$('lgb').onclick=async()=>{$('lge').textContent='';try{await login($('em').value.trim(),$('pw').value);await afterLogin()}catch(e){$('lge').textContent=e.message||'Error'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('lgb').click()};
async function logout(){if(QUEUE.length&&!confirm('Kuch kaam sync nahi hua ('+QUEUE.length+'). Logout karne par wo phone me rahega, par login ke baad hi jayega. Logout karun?'))return;S=null;lsset('sc2s','');location.reload()}
async function afterLogin(){try{const r=await api('/rest/v1/user_profiles?id=eq.'+S.uid+'&select=name,role,active');const j=await r.json();PROF=j[0]||null;if(PROF)await kvset('prof',PROF);if(!PROF||!PROF.active){$('lge').textContent='Tumhara account chalu nahi hai (admin se bolo)';return}}catch(e){PROF=await kvget('prof')}
 $('lg').classList.remove('on');try{await pull()}catch(e){if(e.offline)toast('Offline hoon, phone ka data dikha raha hoon')}fillCo();render();flush()}
window.addEventListener('online',()=>{ONLINE=true;flush()});setInterval(()=>{if(S&&!flushing)flush()},30000);
(async()=>{await idb();await loadLocal();PROF=await kvget('prof');try{const s=JSON.parse(lsget('sc2s')||'null');if(s&&s.rt)S=s}catch(e){}
 fillCo();render();if(S){$('lg').classList.remove('on');try{await pull();fillCo();render();flush();const r=await api('/rest/v1/user_profiles?id=eq.'+S.uid+'&select=name,role,active');if(r.ok){const j=await r.json();if(j[0]){PROF=j[0];await kvset('prof',PROF)}}}catch(e){if(e.auth)showLogin();else if(e.offline)toast('Offline hoon, phone ka data chalega')}}})();
